name: build-kernel

# OnePlus 6T (fajita / SDM845 v2.1) AGNOS 内核编译
#
# 来源: commaai/agnos-kernel-sdm845 (tici_defconfig)
# 适配: 6T 完整设备树（从真机 DTB 反编译 + dtbo merge，已验证可往返编译）
#
# 关键改动 vs tici_defconfig:
#   + CONFIG_MSM_CAMERA=y            camerad 需要 camera_v2 V4L2 路径
#   + CONFIG_SND_SOC_WCD934X=y       音频编进内核（原厂是 .ko，重编后 vermagic 失效）
#   + CONFIG_SND_SOC_WSA881X=y
#   + CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="sdm845-oneplus6t"

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'agnos-kernel-sdm845 分支'
        required: false
        default: 'master'
      jobs:
        description: 'make -j'
        required: false
        default: '4'
  push:
    branches: [main]
    paths:
      - 'dts/**'
      - 'defconfig/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: write

env:
  KERNEL_REPO: 'https://github.com/commaai/agnos-kernel-sdm845.git'
  DEFCONFIG: 'fajita_defconfig'
  DT_NAME: 'sdm845-oneplus6t'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler \
            python3 python3-pip cpio rsync xz-utils libssl-dev libelf-dev \
            gcc libc6-dev make
          # Linux 4.9 的 scripts/ 硬引用 python2（ubuntu-24.04 已移除）。
          # 不动系统源（会污染 apt），直接把 4.9 的 py2 脚本改成 py3：
          # 4.9 的 scripts/kconfig/merge_config.sh、scripts/dtc 的 py 部分
          # 在 py3 下基本兼容，只有 shebang 和少数 print 语句要动。
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2
          echo "python2 -> $(readlink -f /usr/local/bin/python2)"
          python2 --version 2>&1 | head -1
          aarch64-linux-gnu-gcc --version | head -1
          gcc --version | head -1
          dtc --version
          python2 --version

      - name: Fetch kernel source (shallow)
        run: |
          set -euo pipefail
          REF="${{ inputs.kernel_ref || 'master' }}"
          echo "kernel ref: $REF"
          # 1.2GB 仓库，用 blobless + depth 1 大幅减小
          git clone --depth 1 --single-branch --branch "$REF" "$KERNEL_REPO" kernel
          cd kernel
          echo "kernel commit: $(git rev-parse HEAD)"
          du -sh .git . 2>/dev/null | tail -2

      - name: Install 6T board support
        run: |
          set -euo pipefail
          set -x
          # 1. 放入 6T 设备树
          cp dts/${DT_NAME}.dts kernel/arch/arm64/boot/dts/qcom/

          # 2. 注册进 Makefile
          DTS_MAKE=kernel/arch/arm64/boot/dts/qcom/Makefile
          if ! grep -q "${DT_NAME}.dtb" "$DTS_MAKE"; then
            echo "dtb-\$(CONFIG_ARCH_QCOM) += ${DT_NAME}.dtb" >> "$DTS_MAKE"
          fi
          tail -3 "$DTS_MAKE"

          # 3. 放入 defconfig
          cp defconfig/${DEFCONFIG} kernel/arch/arm64/configs/

          # 4. 让 APPENDED_DTB 指向我们的 dtb
          sed -i 's|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/sdm845-oneplus6t"|' \
            kernel/arch/arm64/configs/${DEFCONFIG}
          grep APPENDED kernel/arch/arm64/configs/${DEFCONFIG}

      - name: Patch py2 scripts for py3
        run: |
          set -euo pipefail
          cd kernel
          # Linux 4.9 的 Makefile:369 把 CC 设成 scripts/gcc-wrapper.py，
          # 而该脚本是 py2 语法（print 语句）。ubuntu-24.04 只有 py3。
          # 方案：用 py3 重写该 wrapper，保持"禁止警告"语义不变。
          python3 - <<'PYEOF'
          from pathlib import Path
          wrapper = r"""#!/usr/bin/env python3
          import os, re, subprocess, sys
          if os.environ.get("ALLOW_WERROR_SPAM"):
              sys.exit(subprocess.call(sys.argv[1:]))
          proc = subprocess.Popen(sys.argv[1:], stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE, universal_newlines=True)
          out, err = proc.communicate()
          sys.stdout.write(out)
          sys.stderr.write(err)
          ret = proc.returncode
          # warnings are not promoted to errors (GCC13/14 false positives on 4.9)
          sys.exit(ret)
          """
          Path("scripts/gcc-wrapper.py").write_text(wrapper)
          Path("scripts/gcc-wrapper.py").chmod(0o755)
          PYEOF
          python3 -m py_compile scripts/gcc-wrapper.py && echo "gcc-wrapper.py OK (py3)"
          head -3 scripts/gcc-wrapper.py

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 官方用 O=out 外置构建目录（build_kernel.sh:78-80）。
          # 在源码树内构建会导致 techpack 的 $(srctree) 与
          # trace/define_trace.h 的相对 include 失效。
          mkdir -p out
          make O=out ${{ env.DEFCONFIG }} 2>&1 | tail -15
          echo "=== 关键配置确认 ==="
          grep -E "^CONFIG_MSMB_CAMERA=|^CONFIG_IMG_GZ_DTB=|^CONFIG_TOUCHSCREEN_SYNAPTICS_DSX=|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=|^CONFIG_DRM_MSM_DSI_STAGING=" out/.config || true
          grep -c "^CONFIG_" out/.config

      - name: Build dtb first (fail fast)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-w"
          # Linux 4.9 的 sign-file.c 与 openssl 3.x 的 ENGINE_* 弃用告警冲突，
          # 只有模块签名才需要它；本轮不签模块，直接把 CONFIG_MODULE_SIG 关掉。
          ./scripts/config --file out/.config -d MODULE_SIG -d MODULE_SIG_ALL \
            -d MODULE_SIG_FORCE -d SYSTEM_TRUSTED_KEYS -d SYSTEM_REVOCATION_KEYS || true
          # GCC 13/14 对 Linux 4.9 有一批误报（-Warray-bounds / -Wstringop-overflow /
          # -Wmaybe-uninitialized）。comma 官方用 KCFLAGS="-w" 压制，这里照做。
          make O=out olddefconfig >/dev/null 2>&1 || true
          echo "MODULE_SIG: $(grep -c '^CONFIG_MODULE_SIG=y' out/.config || true)"
          make O=out -j"${{ inputs.jobs }}" qcom/${DT_NAME}.dtb 2>&1 | tail -30
          ls -la out/arch/arm64/boot/dts/qcom/${DT_NAME}.dtb
          file out/arch/arm64/boot/dts/qcom/${DT_NAME}.dtb

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # GCC 13/14 对 4.9 老代码的误报压制（comma 官方 build_kernel.sh:74 同样做法）
          export KCFLAGS="-w"
          export WERROR=0
          # 产物由 CONFIG_IMG_GZ_DTB=y 驱动 -> Image.gz-dtb（与 6T 原厂一致）
          set -o pipefail
          make O=out -j"${{ inputs.jobs }}" Image.gz-dtb > /tmp/kbuild.log 2>&1 || {
            rc=$?
            echo "=== BUILD FAILED rc=$rc, 错误摘要 ==="
            grep -nE 'error:|\*\*\*|No rule|undefined reference|fatal' /tmp/kbuild.log | tail -30
            echo "=== 最后 30 行 ==="
            tail -30 /tmp/kbuild.log
            exit $rc
          }
          tail -20 /tmp/kbuild.log

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          K=kernel/out/arch/arm64/boot
          for f in Image Image.gz Image-dtb Image.gz-dtb; do
            [ -f "$K/$f" ] && cp "$K/$f" dist/ && ls -lh "dist/$f"
          done
          [ -f "$K/dts/qcom/${DT_NAME}.dtb" ] && cp "$K/dts/qcom/${DT_NAME}.dtb" dist/
          # 关键符号表（验证 camerad 依赖的驱动是否真编进去了）
          if [ -f kernel/out/vmlinux ]; then
            cp kernel/out/vmlinux dist/ 2>/dev/null || true
            aarch64-linux-gnu-nm kernel/out/vmlinux 2>/dev/null | grep -iE "msm_camera|imx519|imx371|wcd934x|synaptics" > dist/kernel-symbols.txt || true
            wc -l dist/kernel-symbols.txt 2>/dev/null || true
          fi
          ls -lh dist/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6T-kernel-${{ inputs.kernel_ref || 'master' }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            kernel/out/.config
            /tmp/kbuild.log
          if-no-files-found: ignore
          retention-days: 7
